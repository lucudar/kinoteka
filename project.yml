name: Kinoteka
options:
  bundleIdPrefix: com.lucudar
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
packages:
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: 3.6.0
targets:
  Kinoteka:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: VLCKitSPM
      - framework: Frameworks/TorrServerKit.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucudar.kinoteka
        PRODUCT_NAME: Kinoteka
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS: ["$(inherited)", "-lresolv", "-lc++"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Кинотека
        CFBundleDevelopmentRegion: ru
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Торрент-движок работает внутри приложения и передаёт видео плееру по локальной сети устройства.
        ITSAppUsesNonExemptEncryption: false
schemes:
  Kinoteka:
    build:
      targets:
        Kinoteka: all
    run:
      config: Debug
    archive:
      config: Release
